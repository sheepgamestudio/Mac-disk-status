<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mac Disk Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1c23;
            color: #d0d0d8;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-image: radial-gradient(#2a2d3d 15%, transparent 16%), radial-gradient(#2a2d3d 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
        .card {
            background-color: #242736;
            border: 4px solid #3b3f5c;
            box-shadow: 0 8px 0 #14161f;
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            max-width: 480px;
        }
        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.2rem;
            color: #ffbe55;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        p {
            color: #8f93a2;
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.75rem;
            background-color: #ff5555;
            color: white;
            padding: 16px 24px;
            text-decoration: none;
            border-radius: 4px;
            display: inline-block;
            border-bottom: 4px solid #b33636;
            transition: transform 0.1s, background-color 0.1s;
        }
        .btn:hover {
            background-color: #ff6b6b;
        }
        .btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        .chef {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #63677b;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>MAC DISK STATUS</h1>
        <p>A cozy and lightweight menu bar utility for macOS to keep an eye on your disk space.</p>
        
        <!-- Универсальная ссылка на скачивание файла из последнего релиза -->
        <a href="https://github.com/sheepgamestudio/Mac-disk-status/releases/latest/download/Mac-disk-status.app.zip" class="btn">DOWNLOAD APP</a>
        
        <div class="chef">Kitchen by Master-Chef of SG Studio</div>
    </div>
</body>
</html>
